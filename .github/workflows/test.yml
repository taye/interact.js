on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: '🧪 Test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ianwalter/playwright-container@0aab01e763905bd04a7cc7f79a390db801cf0410
      - name: ⚙ bootstrap
        run: 'npm run bootstrap && npx _check_deps && npx _add_plugin_indexes'
      - name: 📐 types
        run: npx tsc -b -f
      - name: 🔍 lint
        run: npx _lint
      - name: 🧪 tests
        run: npm test
