on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: '🧪 Test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: browser-actions/setup-chrome@0eb8bbcc1e243e1d5290b6dcfe362aa5936e74e2
      - name: ⚙ bootstrap
        run: 'npm run bootstrap && npx _check_deps && npx _add_plugin_indexes'
        env:
          ENV PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      - name: 📐 types
        run: npx tsc -b -f
      - name: 🔍 lint
        run: npx _lint
      - name: 🧪 tests
        run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
